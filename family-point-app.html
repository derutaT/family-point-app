<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>家族ポイントアプリ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f0;
    --bg-tertiary: #eeeee8;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --border-light: rgba(0,0,0,0.1);
    --border-mid: rgba(0,0,0,0.2);
    --accent: #534AB7;
    --accent-light: #EEEDFE;
    --accent-dark: #3C3489;
    --green-light: #E1F5EE;
    --green-dark: #085041;
    --green-btn: #0F6E56;
    --red-light: #FCEBEB;
    --red-dark: #791F1F;
    --red-btn: #A32D2D;
    --amber-light: #FAEEDA;
    --amber-dark: #633806;
    --blue-light: #E6F1FB;
    --blue-dark: #0C447C;
    --coral-light: #FAECE7;
    --coral-dark: #712B13;
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1e1e1e;
      --bg-secondary: #2a2a2a;
      --bg-tertiary: #333333;
      --text-primary: #e8e8e8;
      --text-secondary: #999999;
      --border-light: rgba(255,255,255,0.1);
      --border-mid: rgba(255,255,255,0.2);
      --accent-light: #2e2a50;
      --accent-dark: #AFA9EC;
      --green-light: #0a3028;
      --green-dark: #5DCAA5;
      --red-light: #3a1515;
      --red-dark: #F09595;
      --amber-light: #3a2a10;
      --amber-dark: #FAC775;
      --blue-light: #0c2a40;
      --blue-dark: #85B7EB;
      --coral-light: #3a2018;
      --coral-dark: #F0997B;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100dvh;
  }
  input {
    padding: 10px 12px;
    border: 0.5px solid var(--border-mid);
    border-radius: var(--radius);
    background: var(--bg-primary);
    color: var(--text-primary);
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  button { font-family: inherit; }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const app = document.getElementById('app');
const STORAGE_KEY = 'family-point-app';

const DEFAULT_TASKS = [
  { id: 't1', name: '宿題を終わらせた', points: 15, icon: '📖' },
  { id: 't2', name: '宿題を早く終わらせた', points: 20, icon: '📖' },
  { id: 't3', name: 'ピアノの練習をした', points: 15, icon: '🎹' },
  { id: 't4', name: 'お風呂掃除', points: 10, icon: '🛁' },
  { id: 't5', name: '食器洗い', points: 10, icon: '🍽' },
  { id: 't6', name: '掃除機をかける', points: 10, icon: '🧹' },
  { id: 't7', name: '部屋の片付け', points: 10, icon: '🧹' },
];
const DEFAULT_REWARDS = [
  { id: 'r1', name: 'ゲーム 15分', cost: 15, minutes: 15, icon: '🎮' },
  { id: 'r2', name: 'ゲーム 30分', cost: 30, minutes: 30, icon: '🎮' },
  { id: 'r3', name: 'ゲーム 60分', cost: 60, minutes: 60, icon: '🎮' },
  { id: 'r4', name: '動画 15分', cost: 15, minutes: 15, icon: '📺' },
  { id: 'r5', name: '動画 30分', cost: 30, minutes: 30, icon: '📺' },
  { id: 'r6', name: '動画 60分', cost: 60, minutes: 60, icon: '📺' },
];

function defaultState() {
  return { setup: false, members: [], tasks: DEFAULT_TASKS, rewards: DEFAULT_REWARDS, requests: [], history: [], timerEnd: null, timerLabel: '', dailyAmount: 60 };
}

let state = defaultState();
let currentUser = null;
let currentTab = 'home';
let timerInterval = null;
let pinTarget = null;
let audioCtx = null;

/* ── Daily points logic ── */
function getAppDay(date) {
  const d = date || new Date();
  const h = d.getHours();
  const base = new Date(d);
  if (h < 5) base.setDate(base.getDate() - 1);
  return base.getFullYear() + '-' + String(base.getMonth()+1).padStart(2,'0') + '-' + String(base.getDate()).padStart(2,'0');
}

function refreshDailyPoints() {
  const today = getAppDay();
  let changed = false;
  state.members.forEach(m => {
    if (m.role === 'child') {
      if (m.dailyPoints === undefined) m.dailyPoints = 0;
      if (!m.dailyDate) m.dailyDate = '';
      if (m.dailyDate !== today) {
        m.dailyPoints = state.dailyAmount || 60;
        m.dailyDate = today;
        changed = true;
      }
    }
  });
  if (changed) saveState();
}

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playAlarm() {
  try {
    const ctx = getAudioCtx();
    const notes = [880, 880, 0, 880, 880, 0, 880, 880, 0, 784, 880, 1047];
    const dur = 0.12, gap = 0.06;
    let t = ctx.currentTime;
    notes.forEach(freq => {
      if (freq > 0) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + dur);
      }
      t += dur + gap;
    });
  } catch(e) {}
}

function playTick() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = 660;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.08);
  } catch(e) {}
}

function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) state = JSON.parse(raw); } catch(e) {}
  if (!state.dailyAmount) state.dailyAmount = 60;
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function spendPoints(member, cost) {
  let remain = cost;
  const fromDaily = Math.min(member.dailyPoints || 0, remain);
  member.dailyPoints -= fromDaily;
  remain -= fromDaily;
  if (remain > 0) member.points -= remain;
  return { usedDaily: fromDaily, usedTask: cost - fromDaily };
}

function totalPoints(member) {
  return (member.dailyPoints || 0) + (member.points || 0);
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  });
  children.flat().forEach(c => { if (c != null) e.append(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}

const S = {
  card: { background: 'var(--bg-primary)', border: '0.5px solid var(--border-light)', borderRadius: 'var(--radius-lg)', padding: '1rem 1.25rem', marginBottom: '12px' },
  heading: { fontSize: '20px', fontWeight: '600', margin: '0 0 1rem', color: 'var(--text-primary)' },
  subheading: { fontSize: '16px', fontWeight: '600', margin: '0 0 0.75rem', color: 'var(--text-primary)' },
  muted: { fontSize: '13px', color: 'var(--text-secondary)', margin: '0' },
  badge: { display: 'inline-block', padding: '2px 10px', borderRadius: 'var(--radius)', fontSize: '12px', fontWeight: '600' },
  row: { display: 'flex', alignItems: 'center', gap: '10px' },
  btn: { cursor: 'pointer', padding: '8px 16px', borderRadius: 'var(--radius)', border: '0.5px solid var(--border-mid)', background: 'transparent', fontSize: '14px', fontWeight: '600', color: 'var(--text-primary)' },
  btnPrimary: { cursor: 'pointer', padding: '8px 16px', borderRadius: 'var(--radius)', border: 'none', background: 'var(--accent)', color: '#fff', fontSize: '14px', fontWeight: '600' },
  btnDanger: { cursor: 'pointer', padding: '6px 14px', borderRadius: 'var(--radius)', border: 'none', background: 'var(--red-btn)', color: '#fff', fontSize: '13px', fontWeight: '600' },
  btnSuccess: { cursor: 'pointer', padding: '6px 14px', borderRadius: 'var(--radius)', border: 'none', background: 'var(--green-btn)', color: '#fff', fontSize: '13px', fontWeight: '600' },
  pointsBig: { fontSize: '28px', fontWeight: '600', color: 'var(--accent)' },
  iconCircle: (bg) => ({ width: '40px', height: '40px', borderRadius: '50%', background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '18px', flexShrink: '0' }),
  tabBar: { display: 'flex', gap: '0', borderBottom: '0.5px solid var(--border-light)', marginBottom: '1rem' },
  tab: (active) => ({ padding: '10px 16px', fontSize: '14px', fontWeight: '600', cursor: 'pointer', border: 'none', background: 'transparent', color: active ? 'var(--accent)' : 'var(--text-secondary)', borderBottom: active ? '2px solid var(--accent)' : '2px solid transparent' }),
};

function render() {
  app.innerHTML = '';
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (state.setup) refreshDailyPoints();
  if (!state.setup) return renderSetup();
  if (pinTarget) return renderPinEntry();
  if (!currentUser) return renderLogin();
  const member = state.members.find(m => m.id === currentUser);
  if (!member) { currentUser = null; return renderLogin(); }
  if (member.role === 'parent') renderParent(member);
  else renderChild(member);
}

/* ── Setup ── */
function renderSetup() {
  const wrap = el('div');
  wrap.append(el('p', { style: S.heading }, '家族ポイントアプリ'));
  wrap.append(el('p', { style: { ...S.muted, marginBottom: '1.5rem' } }, '家族のメンバーを登録してください'));
  const ICONS = { parent: ['👨', '👩'], child: ['👦', '👧'] };
  let members = [{ id: 'm1', name: '', role: 'parent', icon: '👨' }, { id: 'm2', name: '', role: 'parent', icon: '👩' }, { id: 'm3', name: '', role: 'child', icon: '👦' }, { id: 'm4', name: '', role: 'child', icon: '👧' }];
  const fields = el('div');
  function rf() {
    fields.innerHTML = '';
    members.forEach((m, i) => {
      const row = el('div', { style: { ...S.row, marginBottom: '10px' } });
      row.append(el('span', { style: { ...S.badge, background: m.role === 'parent' ? 'var(--accent-light)' : 'var(--green-light)', color: m.role === 'parent' ? 'var(--accent-dark)' : 'var(--green-dark)', minWidth: '32px', textAlign: 'center' } }, m.role === 'parent' ? '親' : '子'));
      const iconSel = el('div', { style: { display: 'flex', gap: '4px' } });
      ICONS[m.role].forEach(ico => {
        const btn = el('button', { style: { ...S.btn, padding: '4px 8px', fontSize: '18px', background: m.icon === ico ? 'var(--accent-light)' : 'transparent', borderColor: m.icon === ico ? 'var(--accent)' : 'var(--border-mid)' }, onClick: () => { members[i].icon = ico; rf(); } }, ico);
        iconSel.append(btn);
      });
      row.append(iconSel);
      const input = el('input', { placeholder: m.role === 'parent' ? '親の名前' : '子の名前', value: m.name, style: { flex: '1' } });
      input.addEventListener('input', e => { members[i].name = e.target.value; });
      row.append(input);
      if (members.length > 2) row.append(el('button', { style: { ...S.btn, padding: '6px 10px', fontSize: '12px' }, onClick: () => { members.splice(i, 1); rf(); } }, '✕'));
      fields.append(row);
    });
  }
  rf();
  wrap.append(fields);
  const addRow = el('div', { style: { ...S.row, margin: '12px 0 1.5rem' } });
  addRow.append(
    el('button', { style: { ...S.btn, fontSize: '13px' }, onClick: () => { members.push({ id: 'm' + Date.now(), name: '', role: 'parent' }); rf(); } }, '+ 親を追加'),
    el('button', { style: { ...S.btn, fontSize: '13px' }, onClick: () => { members.push({ id: 'm' + Date.now(), name: '', role: 'child' }); rf(); } }, '+ 子を追加')
  );
  wrap.append(addRow);
  wrap.append(el('button', { style: { ...S.btnPrimary, width: '100%' }, onClick: () => {
    const valid = members.filter(m => m.name.trim());
    if (valid.length < 2 || !valid.some(m => m.role === 'parent') || !valid.some(m => m.role === 'child')) return;
    state.setup = true;
    state.members = valid.map(m => ({ ...m, name: m.name.trim(), points: 0, dailyPoints: 0, dailyDate: '', pin: m.role === 'parent' ? '1234' : '', icon: m.icon || (m.role === 'parent' ? '👨' : '👧') }));
    saveState(); render();
  }}, 'はじめる'));
  app.append(wrap);
}

/* ── PIN Entry ── */
function renderPinEntry() {
  const member = state.members.find(m => m.id === pinTarget);
  if (!member) { pinTarget = null; return render(); }
  const wrap = el('div', { style: { textAlign: 'center' } });
  wrap.append(
    el('div', { style: { ...S.iconCircle('var(--accent-light)'), margin: '0 auto 12px', width: '56px', height: '56px', fontSize: '24px' } }, member.icon || '👨'),
    el('p', { style: { fontWeight: '600', margin: '0 0 4px' } }, member.name),
    el('p', { style: { ...S.muted, marginBottom: '1.5rem' } }, '保護者PINを入力してください')
  );
  let pinValue = '';
  const dots = el('div', { style: { ...S.row, justifyContent: 'center', gap: '12px', marginBottom: '1.5rem', height: '32px' } });
  function ud() {
    dots.innerHTML = '';
    for (let i = 0; i < 4; i++) dots.append(el('div', { style: { width: '16px', height: '16px', borderRadius: '50%', background: i < pinValue.length ? 'var(--accent)' : 'var(--border-light)', transition: 'background 0.15s' } }));
  }
  ud();
  wrap.append(dots);
  const errMsg = el('p', { style: { ...S.muted, color: 'var(--red-btn)', fontSize: '13px', minHeight: '20px', marginBottom: '12px' } });
  wrap.append(errMsg);
  const numpad = el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '10px', maxWidth: '240px', margin: '0 auto 1rem' } });
  const bs = { cursor: 'pointer', padding: '14px 0', borderRadius: 'var(--radius)', border: '0.5px solid var(--border-light)', background: 'var(--bg-secondary)', fontSize: '20px', fontWeight: '600', color: 'var(--text-primary)' };
  function hd(d) {
    if (pinValue.length >= 4) return;
    pinValue += d; ud(); errMsg.textContent = '';
    if (pinValue.length === 4) {
      if (pinValue === (member.pin || '1234')) { currentUser = member.id; currentTab = 'home'; pinTarget = null; saveState(); render(); }
      else { errMsg.textContent = 'PINが違います。もう一度入力してください。'; pinValue = ''; setTimeout(ud, 300); }
    }
  }
  [1,2,3,4,5,6,7,8,9].forEach(n => numpad.append(el('button', { style: bs, onClick: () => hd(String(n)) }, String(n))));
  numpad.append(el('div'));
  numpad.append(el('button', { style: bs, onClick: () => hd('0') }, '0'));
  numpad.append(el('button', { style: { ...bs, fontSize: '14px' }, onClick: () => { pinValue = pinValue.slice(0,-1); ud(); errMsg.textContent = ''; } }, '←'));
  wrap.append(numpad);
  wrap.append(el('button', { style: { ...S.btn, fontSize: '13px', marginTop: '8px' }, onClick: () => { pinTarget = null; render(); } }, '← 戻る'));
  app.append(wrap);
}

/* ── Login ── */
function renderLogin() {
  const wrap = el('div');
  wrap.append(el('p', { style: { ...S.heading, textAlign: 'center' } }, 'だれが使いますか？'));
  const grid = el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: '12px', marginBottom: '1.5rem' } });
  state.members.forEach(m => {
    const isP = m.role === 'parent';
    const card = el('div', { style: { ...S.card, cursor: 'pointer', textAlign: 'center', padding: '1.5rem 1rem' }, onClick: () => {
      if (isP) { pinTarget = m.id; render(); return; }
      currentUser = m.id; currentTab = 'home'; saveState(); render();
    }});
    card.append(
      el('div', { style: { ...S.iconCircle(isP ? 'var(--accent-light)' : 'var(--green-light)'), margin: '0 auto 10px', width: '56px', height: '56px', fontSize: '24px' } }, m.icon || (isP ? '👨' : '👧')),
      el('p', { style: { fontWeight: '600', margin: '0 0 4px', fontSize: '15px' } }, m.name),
      el('p', { style: { ...S.muted, fontSize: '12px' } }, isP ? '保護者' : 'こども')
    );
    grid.append(card);
  });
  wrap.append(grid);
  wrap.append(el('button', { style: { ...S.btn, width: '100%', fontSize: '13px' }, onClick: () => {
    showModal('すべてのデータをリセットしますか？', null, () => { state = defaultState(); currentUser = null; pinTarget = null; saveState(); render(); });
  }}, 'データをリセット'));
  app.append(wrap);
}

/* ── Modal ── */
function showModal(title, inputLabel, callback) {
  const ov = el('div', { style: { position: 'fixed', top: '0', left: '0', right: '0', bottom: '0', background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: '999', padding: '16px' } });
  const md = el('div', { style: { background: 'var(--bg-primary)', borderRadius: 'var(--radius-lg)', padding: '1.5rem', width: '300px', maxWidth: '100%' } });
  md.append(el('p', { style: { fontWeight: '600', margin: '0 0 16px', fontSize: '15px' } }, title));
  let inp;
  if (inputLabel !== null) {
    inp = el('input', { placeholder: inputLabel || '', style: { width: '100%', marginBottom: '16px' } });
    md.append(inp);
  }
  const btns = el('div', { style: { display: 'flex', gap: '8px', justifyContent: 'flex-end' } });
  btns.append(
    el('button', { style: S.btn, onClick: () => ov.remove() }, 'キャンセル'),
    el('button', { style: inputLabel !== null ? S.btnPrimary : S.btnDanger, onClick: () => { ov.remove(); callback(inp ? inp.value : true); } }, 'OK')
  );
  md.append(btns);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.append(md);
  document.body.append(ov);
  if (inp) setTimeout(() => inp.focus(), 50);
}

/* ── Point display ── */
function renderPointCard(member) {
  const card = el('div', { style: { ...S.card, padding: '1.25rem' } });
  const totalRow = el('div', { style: { textAlign: 'center', marginBottom: '12px' } });
  totalRow.append(
    el('p', { style: S.muted }, '使えるポイント合計'),
    el('p', { style: { ...S.pointsBig, margin: '4px 0' } }, totalPoints(member) + ' pt')
  );
  card.append(totalRow);

  const detailRow = el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' } });
  const dailyBox = el('div', { style: { background: 'var(--coral-light)', borderRadius: 'var(--radius)', padding: '10px', textAlign: 'center' } });
  dailyBox.append(
    el('p', { style: { fontSize: '11px', fontWeight: '600', color: 'var(--coral-dark)', margin: '0 0 2px' } }, '今日のポイント'),
    el('p', { style: { fontSize: '20px', fontWeight: '600', color: 'var(--coral-dark)', margin: '0' } }, (member.dailyPoints || 0) + ' pt')
  );
  const taskBox = el('div', { style: { background: 'var(--green-light)', borderRadius: 'var(--radius)', padding: '10px', textAlign: 'center' } });
  taskBox.append(
    el('p', { style: { fontSize: '11px', fontWeight: '600', color: 'var(--green-dark)', margin: '0 0 2px' } }, 'タスクポイント'),
    el('p', { style: { fontSize: '20px', fontWeight: '600', color: 'var(--green-dark)', margin: '0' } }, (member.points || 0) + ' pt')
  );
  detailRow.append(dailyBox, taskBox);
  card.append(detailRow);
  return card;
}

/* ── Child View ── */
function renderChild(member) {
  const wrap = el('div');
  const header = el('div', { style: { ...S.row, justifyContent: 'space-between', marginBottom: '1rem' } });
  header.append(
    el('div', { style: S.row }, el('div', { style: S.iconCircle('var(--green-light)') }, member.icon || '👧'), el('span', { style: { fontWeight: '600' } }, member.name)),
    el('button', { style: { ...S.btn, fontSize: '12px', padding: '4px 12px' }, onClick: () => { currentUser = null; render(); } }, 'ログアウト')
  );
  wrap.append(header);
  wrap.append(renderPointCard(member));

  const tabs = el('div', { style: S.tabBar });
  ['つかう', '申請', 'タイマー'].forEach((t, i) => {
    const keys = ['redeem', 'request', 'timer'];
    tabs.append(el('button', { style: S.tab(currentTab === keys[i]), onClick: () => { currentTab = keys[i]; render(); } }, t));
  });
  wrap.append(tabs);

  if (currentTab === 'redeem' || currentTab === 'home') {
    currentTab = 'redeem';
    wrap.append(el('p', { style: S.subheading }, 'ポイントをつかう'));
    wrap.append(el('p', { style: { ...S.muted, marginBottom: '12px' } }, '今日のポイントから先に消費されます'));
    state.rewards.forEach(r => {
      const can = totalPoints(member) >= r.cost;
      const row = el('div', { style: { ...S.card, ...S.row, justifyContent: 'space-between', padding: '12px 1rem', opacity: can ? '1' : '0.5' } });
      row.append(
        el('div', { style: S.row }, el('span', { style: { fontSize: '20px' } }, r.icon), el('div', null, el('p', { style: { margin: '0', fontSize: '14px', fontWeight: '600' } }, r.name), el('p', { style: { ...S.muted, fontSize: '12px' } }, r.cost + 'pt 必要'))),
        el('button', { style: { ...S.btnPrimary, fontSize: '13px', padding: '6px 14px', opacity: can ? '1' : '0.5' }, onClick: () => {
          if (!can) return;
          const { usedDaily, usedTask } = spendPoints(member, r.cost);
          state.history.push({ type: 'redeem', childId: member.id, childName: member.name, rewardName: r.name, cost: r.cost, usedDaily, usedTask, minutes: r.minutes, date: new Date().toISOString() });
          state.timerEnd = Date.now() + r.minutes * 60000;
          state.timerLabel = r.name;
          currentTab = 'timer';
          saveState(); render();
        }}, 'つかう')
      );
      wrap.append(row);
    });
  }

  if (currentTab === 'request') {
    wrap.append(el('p', { style: S.subheading }, 'ポイントを申請する'));
    state.tasks.forEach(t => {
      const row = el('div', { style: { ...S.card, ...S.row, justifyContent: 'space-between', cursor: 'pointer', padding: '12px 1rem' }, onClick: () => {
        state.requests.push({ id: 'req' + Date.now(), taskId: t.id, taskName: t.name, points: t.points, childId: member.id, childName: member.name, date: new Date().toISOString(), status: 'pending' });
        saveState(); render();
      }});
      row.append(
        el('div', { style: S.row }, el('span', { style: { fontSize: '20px' } }, t.icon), el('span', { style: { fontSize: '14px' } }, t.name)),
        el('span', { style: { ...S.badge, background: 'var(--accent-light)', color: 'var(--accent-dark)' } }, '+' + t.points + 'pt')
      );
      wrap.append(row);
    });
    const pending = state.requests.filter(r => r.childId === member.id && r.status === 'pending');
    if (pending.length) {
      wrap.append(el('p', { style: { ...S.subheading, marginTop: '1rem' } }, '承認待ち'));
      pending.forEach(r => {
        wrap.append(el('div', { style: { ...S.card, ...S.row, padding: '10px 1rem' } }, el('span', { style: { fontSize: '14px', flex: '1' } }, r.taskName), el('span', { style: { ...S.badge, background: 'var(--amber-light)', color: 'var(--amber-dark)' } }, '承認待ち')));
      });
    }
  }

  if (currentTab === 'timer') renderTimer(wrap);
  app.append(wrap);
}

/* ── Timer ── */
function renderTimer(wrap) {
  wrap.append(el('p', { style: { ...S.subheading, textAlign: 'center' } }, 'タイマー'));
  if (!state.timerEnd || Date.now() > state.timerEnd) {
    const card = el('div', { style: { ...S.card, textAlign: 'center', padding: '2rem' } });
    if (state.timerEnd && Date.now() > state.timerEnd) {
      playAlarm();
      card.append(el('p', { style: { fontSize: '40px', margin: '0 0 8px' } }, '⏰'), el('p', { style: { fontWeight: '600', fontSize: '16px', margin: '0 0 4px', color: 'var(--red-btn)' } }, '時間終了！'), el('p', { style: S.muted }, state.timerLabel || ''));
      card.append(el('button', { style: { ...S.btn, marginTop: '12px' }, onClick: () => { state.timerEnd = null; state.timerLabel = ''; saveState(); render(); } }, 'OK'));
    } else {
      card.append(el('p', { style: { fontSize: '40px', margin: '0 0 8px' } }, '⏳'), el('p', { style: S.muted }, 'ポイントを使うとタイマーが始まります'));
    }
    wrap.append(card);
    return;
  }

  const remaining = Math.max(0, state.timerEnd - Date.now());
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  const lastH = state.history.filter(h => h.type === 'redeem').pop();
  const totalDur = lastH ? lastH.minutes * 60000 : 1800000;
  const pct = Math.min(100, ((totalDur - remaining) / totalDur) * 100);

  const card = el('div', { style: { ...S.card, textAlign: 'center', padding: '1.5rem' } });
  card.append(el('p', { style: { ...S.muted, marginBottom: '8px' } }, state.timerLabel));

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', '160'); svg.setAttribute('height', '160'); svg.setAttribute('viewBox', '0 0 160 160');
  svg.style.margin = '0 auto 12px'; svg.style.display = 'block';
  const rad = 68, circ = 2 * Math.PI * rad;
  const bgC = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  bgC.setAttribute('cx','80'); bgC.setAttribute('cy','80'); bgC.setAttribute('r',String(rad));
  bgC.setAttribute('fill','none'); bgC.setAttribute('stroke','var(--border-light)'); bgC.setAttribute('stroke-width','8');
  const fgC = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  fgC.setAttribute('cx','80'); fgC.setAttribute('cy','80'); fgC.setAttribute('r',String(rad));
  fgC.setAttribute('fill','none'); fgC.setAttribute('stroke','var(--accent)'); fgC.setAttribute('stroke-width','8');
  fgC.setAttribute('stroke-linecap','round'); fgC.setAttribute('stroke-dasharray',String(circ));
  fgC.setAttribute('stroke-dashoffset',String(circ*(1-pct/100))); fgC.setAttribute('transform','rotate(-90 80 80)');
  const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  txt.setAttribute('x','80'); txt.setAttribute('y','86'); txt.setAttribute('text-anchor','middle');
  txt.setAttribute('font-size','28'); txt.setAttribute('font-weight','600'); txt.setAttribute('fill','var(--text-primary)');
  txt.textContent = String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
  svg.append(bgC, fgC, txt);
  card.append(svg);
  card.append(el('p', { style: { ...S.muted, fontSize: '12px' } }, '残り時間'));

  let warnPlayed = false;
  timerInterval = setInterval(() => {
    const rem = Math.max(0, state.timerEnd - Date.now());
    const m2 = Math.floor(rem/60000), s2 = Math.floor((rem%60000)/1000);
    txt.textContent = String(m2).padStart(2,'0')+':'+String(s2).padStart(2,'0');
    const p2 = Math.min(100,((totalDur-rem)/totalDur)*100);
    fgC.setAttribute('stroke-dashoffset',String(circ*(1-p2/100)));
    if (rem <= 60000 && !warnPlayed) { fgC.setAttribute('stroke','var(--red-btn)'); warnPlayed = true; }
    if (rem <= 10000 && rem > 0 && s2 !== Math.floor(((rem+1000)%60000)/1000)) playTick();
    if (rem <= 0) { clearInterval(timerInterval); render(); }
  }, 250);

  wrap.append(card);
}

/* ── Parent View ── */
function renderParent(member) {
  const wrap = el('div');
  const header = el('div', { style: { ...S.row, justifyContent: 'space-between', marginBottom: '1rem' } });
  header.append(
    el('div', { style: S.row }, el('div', { style: S.iconCircle('var(--accent-light)') }, member.icon || '👨'), el('span', { style: { fontWeight: '600' } }, member.name + '（保護者）')),
    el('button', { style: { ...S.btn, fontSize: '12px', padding: '4px 12px' }, onClick: () => { currentUser = null; render(); } }, 'ログアウト')
  );
  wrap.append(header);

  const tabs = el('div', { style: S.tabBar });
  ['承認', 'ポイント', '履歴', '設定'].forEach((t, i) => {
    const keys = ['approve', 'points', 'history', 'settings'];
    tabs.append(el('button', { style: S.tab(currentTab === keys[i]), onClick: () => { currentTab = keys[i]; render(); } }, t));
  });
  wrap.append(tabs);

  if (currentTab === 'approve' || currentTab === 'home') {
    currentTab = 'approve';
    const pending = state.requests.filter(r => r.status === 'pending');
    if (!pending.length) {
      wrap.append(el('div', { style: { ...S.card, textAlign: 'center', padding: '2rem' } }, el('p', { style: { fontSize: '32px', margin: '0 0 8px' } }, '✅'), el('p', { style: S.muted }, '承認待ちの申請はありません')));
    } else {
      wrap.append(el('p', { style: S.subheading }, '承認待ち（' + pending.length + '件）'));
      pending.forEach(r => {
        const card = el('div', { style: { ...S.card, padding: '12px 1rem' } });
        const top = el('div', { style: { ...S.row, justifyContent: 'space-between', marginBottom: '8px' } });
        top.append(
          el('div', null, el('p', { style: { margin: '0', fontWeight: '600', fontSize: '14px' } }, r.taskName), el('p', { style: { ...S.muted, fontSize: '12px' } }, r.childName + ' · ' + new Date(r.date).toLocaleString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }))),
          el('span', { style: { ...S.badge, background: 'var(--accent-light)', color: 'var(--accent-dark)' } }, '+' + r.points + 'pt')
        );
        const btns = el('div', { style: { ...S.row, justifyContent: 'flex-end' } });
        btns.append(
          el('button', { style: { ...S.btn, fontSize: '13px', padding: '6px 14px' }, onClick: () => { r.status = 'rejected'; state.history.push({ type: 'reject', ...r, approvedBy: member.name, date: new Date().toISOString() }); saveState(); render(); } }, '却下'),
          el('button', { style: { ...S.btnSuccess, padding: '6px 14px' }, onClick: () => {
            r.status = 'approved';
            const child = state.members.find(m => m.id === r.childId);
            if (child) child.points += r.points;
            state.history.push({ type: 'approve', ...r, approvedBy: member.name, date: new Date().toISOString() });
            saveState(); render();
          }}, '承認')
        );
        card.append(top, btns);
        wrap.append(card);
      });
    }
  }

  if (currentTab === 'points') {
    wrap.append(el('p', { style: S.subheading }, 'ポイント残高'));
    state.members.filter(m => m.role === 'child').forEach(c => {
      const card = el('div', { style: { ...S.card, padding: '14px 1rem' } });
      const topRow = el('div', { style: { ...S.row, justifyContent: 'space-between', marginBottom: '10px' } });
      topRow.append(
        el('div', { style: S.row }, el('div', { style: S.iconCircle('var(--green-light)') }, c.icon || '👧'), el('span', { style: { fontWeight: '600' } }, c.name)),
        el('p', { style: { margin: '0', fontSize: '22px', fontWeight: '600', color: 'var(--accent)' } }, totalPoints(c) + ' pt')
      );
      card.append(topRow);

      const detailRow = el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '10px' } });
      const dBox = el('div', { style: { background: 'var(--coral-light)', borderRadius: 'var(--radius)', padding: '8px', textAlign: 'center' } });
      dBox.append(el('p', { style: { fontSize: '11px', color: 'var(--coral-dark)', margin: '0' } }, '今日のポイント'), el('p', { style: { fontSize: '16px', fontWeight: '600', color: 'var(--coral-dark)', margin: '0' } }, (c.dailyPoints || 0) + ' pt'));
      const tBox = el('div', { style: { background: 'var(--green-light)', borderRadius: 'var(--radius)', padding: '8px', textAlign: 'center' } });
      tBox.append(el('p', { style: { fontSize: '11px', color: 'var(--green-dark)', margin: '0' } }, 'タスクポイント'), el('p', { style: { fontSize: '16px', fontWeight: '600', color: 'var(--green-dark)', margin: '0' } }, (c.points || 0) + ' pt'));
      detailRow.append(dBox, tBox);
      card.append(detailRow);

      card.append(el('button', { style: { ...S.btn, fontSize: '11px', padding: '3px 8px' }, onClick: () => {
        showModal('タスクポイントを手動調整（マイナスも可）', '例: 10', (v) => {
          const n = parseInt(v); if (isNaN(n)) return;
          c.points += n; state.history.push({ type: 'manual', childId: c.id, childName: c.name, points: n, by: member.name, date: new Date().toISOString() });
          saveState(); render();
        });
      }}, 'タスクポイント手動調整'));
      wrap.append(card);
    });
  }

  if (currentTab === 'history') {
    wrap.append(el('p', { style: S.subheading }, '最近の履歴'));
    const hist = [...state.history].reverse().slice(0, 30);
    if (!hist.length) wrap.append(el('div', { style: { ...S.card, textAlign: 'center', padding: '1.5rem' } }, el('p', { style: S.muted }, 'まだ履歴がありません')));
    hist.forEach(h => {
      const card = el('div', { style: { ...S.card, padding: '10px 1rem' } });
      let label, bg, color;
      if (h.type === 'approve') { label = '承認'; bg = 'var(--green-light)'; color = 'var(--green-dark)'; }
      else if (h.type === 'reject') { label = '却下'; bg = 'var(--red-light)'; color = 'var(--red-dark)'; }
      else if (h.type === 'redeem') { label = '使用'; bg = 'var(--amber-light)'; color = 'var(--amber-dark)'; }
      else { label = '手動'; bg = 'var(--blue-light)'; color = 'var(--blue-dark)'; }

      let detail = h.taskName || h.rewardName || ((h.points > 0 ? '+' : '') + h.points + 'pt');
      if (h.type === 'redeem' && h.usedDaily !== undefined) {
        detail += '（日替' + h.usedDaily + ' / タスク' + h.usedTask + '）';
      }

      card.append(el('div', { style: { ...S.row, justifyContent: 'space-between' } },
        el('div', null, el('p', { style: { margin: '0', fontSize: '13px', fontWeight: '600' } }, detail), el('p', { style: { ...S.muted, fontSize: '11px' } }, (h.childName || '') + ' · ' + new Date(h.date).toLocaleString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }))),
        el('span', { style: { ...S.badge, background: bg, color } }, label)
      ));
      wrap.append(card);
    });
  }

  if (currentTab === 'settings') {
    wrap.append(el('p', { style: S.subheading }, '日替わりポイント'));
    const dailyCard = el('div', { style: { ...S.card, ...S.row, justifyContent: 'space-between', padding: '12px 1rem' } });
    dailyCard.append(
      el('div', null, el('p', { style: { margin: '0', fontSize: '14px', fontWeight: '600' } }, '毎日の付与ポイント'), el('p', { style: { ...S.muted, fontSize: '12px' } }, '毎朝5時にリセット・付与')),
      el('div', { style: S.row },
        el('span', { style: { ...S.badge, background: 'var(--coral-light)', color: 'var(--coral-dark)' } }, state.dailyAmount + 'pt'),
        el('button', { style: { ...S.btn, fontSize: '11px', padding: '3px 8px' }, onClick: () => {
          showModal('日替わりポイント数', '例: 60', (v) => {
            const n = parseInt(v); if (isNaN(n) || n < 0) return;
            state.dailyAmount = n; saveState(); render();
          });
        }}, '変更')
      )
    );
    wrap.append(dailyCard);

    wrap.append(el('p', { style: S.subheading }, 'タスク一覧'));
    state.tasks.forEach((t, i) => {
      const row = el('div', { style: { ...S.card, ...S.row, justifyContent: 'space-between', padding: '10px 1rem' } });
      row.append(
        el('div', { style: S.row }, el('span', null, t.icon), el('span', { style: { fontSize: '14px' } }, t.name)),
        el('div', { style: S.row }, el('span', { style: { ...S.badge, background: 'var(--accent-light)', color: 'var(--accent-dark)' } }, t.points + 'pt'), el('button', { style: { ...S.btn, fontSize: '11px', padding: '2px 8px' }, onClick: () => { state.tasks.splice(i,1); saveState(); render(); } }, '✕'))
      );
      wrap.append(row);
    });
    wrap.append(el('button', { style: { ...S.btn, fontSize: '13px', marginBottom: '1.5rem' }, onClick: () => {
      showModal('タスク名', 'タスク名を入力', (name) => {
        if (!name) return;
        showModal('ポイント数', '例: 20', (v) => {
          const pts = parseInt(v); if (isNaN(pts)) return;
          state.tasks.push({ id: 't' + Date.now(), name, points: pts, icon: '⭐' });
          saveState(); render();
        });
      });
    }}, '+ タスクを追加'));

    wrap.append(el('p', { style: S.subheading }, 'ごほうび一覧'));
    state.rewards.forEach((r, i) => {
      const row = el('div', { style: { ...S.card, ...S.row, justifyContent: 'space-between', padding: '10px 1rem' } });
      row.append(
        el('div', { style: S.row }, el('span', null, r.icon), el('span', { style: { fontSize: '14px' } }, r.name)),
        el('div', { style: S.row }, el('span', { style: { ...S.badge, background: 'var(--amber-light)', color: 'var(--amber-dark)' } }, r.cost + 'pt'), el('button', { style: { ...S.btn, fontSize: '11px', padding: '2px 8px' }, onClick: () => { state.rewards.splice(i,1); saveState(); render(); } }, '✕'))
      );
      wrap.append(row);
    });
    wrap.append(el('button', { style: { ...S.btn, fontSize: '13px', marginBottom: '1.5rem' }, onClick: () => {
      showModal('ごほうび名', 'ごほうび名を入力', (name) => {
        if (!name) return;
        showModal('必要ポイント数', '例: 30', (v1) => {
          const cost = parseInt(v1); if (isNaN(cost)) return;
          showModal('時間（分）', '例: 30', (v2) => {
            const mins = parseInt(v2); if (isNaN(mins)) return;
            state.rewards.push({ id: 'r' + Date.now(), name, cost, minutes: mins, icon: '🎁' });
            saveState(); render();
          });
        });
      });
    }}, '+ ごほうびを追加'));

    wrap.append(el('p', { style: S.subheading }, 'PIN変更'));
    wrap.append(el('button', { style: { ...S.btn, fontSize: '13px', marginBottom: '1rem' }, onClick: () => {
      showModal('新しいPIN（4桁）', '4桁の数字', (pin) => {
        if (pin && pin.length === 4 && /^\d{4}$/.test(pin)) { member.pin = pin; saveState(); }
      });
    }}, 'PINを変更'));
  }
  app.append(wrap);
}

/* ── Boot ── */
loadState();
render();
</script>
</body>
</html>
